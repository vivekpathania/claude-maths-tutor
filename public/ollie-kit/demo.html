<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Ollie demo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<link rel="stylesheet" href="ollie/ollie.css">
<style>
  /* Demo-only page styles. In the app these come from app.css. */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #FBF6EC; color: #2B2722; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; }
  .demo-main { width: 100%; max-width: 1000px; padding: 40px 40px 120px; }
  .demo-card { background: #FFFFFF; border: 1px solid #E8DFD0; border-radius: 28px; padding: 36px 40px; display: flex; flex-direction: column; gap: 22px; }
  .demo-card.is-right { border: 3px solid #3E6B55; }
  .demo-pill { align-self: flex-start; padding: 6px 14px; border-radius: 999px; background: #EFE7D8; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #4F473E; }
  h1 { margin: 0; font-family: 'Baloo 2', ui-rounded, sans-serif; font-size: 42px; font-weight: 800; line-height: 1.1; }
  .demo-sub { margin: 6px 0 0; font-size: 18px; font-weight: 700; color: #4F473E; }
  label { font-weight: 800; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; }
  .demo-answer { width: 300px; max-width: 100%; height: 76px; padding: 0 22px; border-radius: 20px; border: 3px solid #E8DFD0; background: #FFFFFF; font-family: 'Baloo 2', ui-rounded, sans-serif; font-size: 36px; font-weight: 700; color: #2B2722; outline: none; }
  .demo-answer:focus { border-color: #3B6FD8; box-shadow: 0 0 0 5px #DCE6FA; }
  .demo-answer[data-state="retry"] { border-color: #B85F1F; background: #FFF6EC; box-shadow: none; }
  .demo-btn { min-width: 168px; height: 76px; padding: 0 28px; border: 0; border-radius: 20px; background: #3E6B55; color: #FFFFFF; font-family: 'Baloo 2', ui-rounded, sans-serif; font-size: 26px; font-weight: 800; cursor: pointer; }
  .demo-btn:hover { background: #2C4F3E; }
  .demo-btn:focus-visible { outline: 3px solid #3B6FD8; outline-offset: 2px; }
  .demo-showme { padding: 22px; border-radius: 22px; background: #FBF6EC; font-size: 17px; font-weight: 700; line-height: 1.6; }
  .demo-showme ol { margin: 8px 0 0; padding-left: 22px; }
  .demo-done { padding: 18px 22px; border-radius: 20px; background: #E3EEE6; color: #1F3A2D; font-family: 'Baloo 2', ui-rounded, sans-serif; font-size: 30px; font-weight: 800; }
  .demo-start { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgb(43 39 34 / 0.45); padding: 16px; }
  .demo-start__card { background: #FFFFFF; border-radius: 28px; padding: 32px; max-width: 420px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; }
  .demo-start__card p { margin: 0; font-weight: 700; color: #4F473E; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="demo-start" id="start">
  <div class="demo-start__card">
    <span id="start-ollie"></span>
    <h1>Ready, Sam?</h1>
    <p>Ollie will talk to you, so turn your sound on.</p>
    <button type="button" class="demo-btn" id="go">Let’s go</button>
  </div>
</div>

<main class="demo-main ollie-content">
  <section class="demo-card" id="card" aria-labelledby="q">
    <span class="demo-pill">PRACTICE 5 OF 8</span>
    <div>
      <h1 id="q">How many degrees is a right angle?</h1>
      <p class="demo-sub">Type just the number.</p>
    </div>

    <div class="demo-showme" id="showme" hidden>
      <strong>Let’s build it together</strong>
      <ol>
        <li>One full turn, all the way round, is 360°.</li>
        <li>A right angle is one quarter of a full turn.</li>
        <li>360 ÷ 4 = ?</li>
      </ol>
    </div>

    <div id="answer-area">
      <label for="answer" id="answer-label">Your answer</label>
      <div class="demo-row">
        <input id="answer" class="demo-answer" type="text" inputmode="numeric" placeholder="Type a number" autocomplete="off">
        <button type="button" class="demo-btn" id="check">Check</button>
      </div>
    </div>

    <!-- the clue area lives under the answer box -->
    <div class="ollie-clues" id="clue-area"></div>

    <div class="demo-done" id="done" hidden>90°. That’s right!</div>
  </section>
</main>

<script src="ollie/ollie-lines.js"></script>
<script src="ollie/ollie-character.js"></script>
<script src="ollie/ollie-dock.js"></script>
<script src="ollie/ollie-clues.js"></script>
<script>
  // A still Ollie on the start card
  document.getElementById('start-ollie').innerHTML = OllieCharacter.markup({ size: 120, mood: 'wave' });

  var dock = OllieDock.mount({ register: 'practice', name: 'Sam' });

  var answer = document.getElementById('answer');
  var checkBtn = document.getElementById('check');
  var card = document.getElementById('card');

  var clues = OllieClues.create({
    container: document.getElementById('clue-area'),
    clues: [
      'Think of the square corner of a book or a door. That corner is a right angle.',
      'A full turn is 360°. A right angle is a quarter of a full turn.'
    ],
    dock: dock,
    register: 'practice',
    onShowMe: function () {
      document.getElementById('showme').hidden = false;
      document.getElementById('answer-label').textContent = 'Now you type it';
      answer.value = ''; answer.removeAttribute('data-state'); answer.focus();
    }
  });

  document.getElementById('go').addEventListener('click', function () {
    dock.unlock();                       // browsers need a tap before sound
    document.getElementById('start').hidden = true;
    dock.say('returning');
    answer.focus();
  });

  function check() {
    var v = answer.value.replace(/[°\s]/g, '');
    if (!v) { dock.sayText('Have a go first. Type a number in the box.', { mood: 'neutral' }); return; }
    if (v === '90') {
      var r = clues.correct();
      card.classList.add('is-right');
      document.getElementById('answer-area').hidden = true;
      document.getElementById('showme').hidden = true;
      document.getElementById('done').hidden = false;
      console.log('progress marker:', r.firstTry ? 'star' : 'with help', r);
      return;
    }
    answer.setAttribute('data-state', 'retry');
    checkBtn.textContent = 'Try again';
    clues.wrongTry();
  }
  checkBtn.addEventListener('click', check);
  answer.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
  answer.addEventListener('input', function () { answer.removeAttribute('data-state'); });
</script>
</body>
</html>
