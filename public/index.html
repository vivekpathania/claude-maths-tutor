<!-- Tailwind CSS CDN — this page is a single static file with no build step.
     Colours resolve to the variables in theme.css so there is one palette. -->

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
        colors: {
          app: {
            canvas: 'rgb(var(--rgb-canvas) / <alpha-value>)',
            cream: 'rgb(var(--rgb-cream) / <alpha-value>)',
            card: 'rgb(var(--rgb-card) / <alpha-value>)',
            border: 'rgb(var(--rgb-border) / <alpha-value>)',
            dark: 'rgb(var(--rgb-dark) / <alpha-value>)',
            muted: 'rgb(var(--rgb-muted) / <alpha-value>)',
            sage: 'rgb(var(--rgb-sage) / <alpha-value>)',
            sageHover: 'rgb(var(--rgb-sage-hover) / <alpha-value>)',
            sageLight: 'rgb(var(--rgb-sage-light) / <alpha-value>)',
            sageHighlight: 'rgb(var(--rgb-sage-highlight) / <alpha-value>)',
            peachBorder: 'rgb(var(--rgb-peach-border) / <alpha-value>)',
            peachBg: 'rgb(var(--rgb-peach-bg) / <alpha-value>)',
            peachText: 'rgb(var(--rgb-peach-text) / <alpha-value>)',
            grayBox: 'rgb(var(--rgb-gray-box) / <alpha-value>)',
            grayHover: 'rgb(var(--rgb-gray-hover) / <alpha-value>)',
            dot: 'rgb(var(--rgb-dot) / <alpha-value>)',
            ollieBg: 'rgb(var(--rgb-ollie-bg) / <alpha-value>)',
            ollieBorder: 'rgb(var(--rgb-ollie-border) / <alpha-value>)'
          }
        }
      }
    }
  };
</script>
<style>
/* iPad/iOS Safari overlays the on-screen keyboard instead of shrinking the
   layout viewport, so CSS svh/dvh stay full-screen while the keyboard covers
   the bottom half. --vvh is set from window.visualViewport by the page script. */
html{min-height:100%}
body{min-height:100svh;min-height:var(--vvh,100svh)}
[hidden]{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){ .enter{animation:rise .2s ease-out both} }
@keyframes pvPop{0%{transform:scale(.55) translateY(5px)}65%{transform:scale(1.14) translateY(-2px)}100%{transform:scale(1) translateY(0)}}
.pv-lit{animation:pvPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes qBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.q-placeholder::placeholder{animation:qBounce 1.6s ease-in-out infinite}
/* The @tailwindcss/forms plugin gives every text input its own blue focus
   ring via box-shadow, not outline — focus:outline-none never touches it,
   and even focus:shadow-none loses the specificity fight with the plugin's
   own [type='text']:focus rule. This is a direct, narrow override of that
   one plugin default, not a general pattern. */
.q-placeholder:focus{box-shadow:none!important}
</style>
</head>
<body class="session-body">
<header class="page-header">
  <div class="page-bar">
    <div class="ol-header__brand" id="brand-topic">
      <span class="ol-icon-tile" id="topic-mark" aria-hidden="true"></span>
      <div class="ol-header__copy">
        <span id="topic-eyebrow" class="ol-header__eyebrow"></span>
        <span id="topic-name" class="ol-header__title"></span>
      </div>
    </div>
    <div class="ol-header__brand" id="brand-start" hidden>
      <div class="ol-header__copy">
        <span id="start-date" class="ol-header__eyebrow"></span>
        <span class="ol-header__title">Coach Ollie</span>
      </div>
    </div>
    <div id="macro-steps" class="session-macro-steps"></div>
    <div class="ol-header__actions">
      <span id="streak" class="ol-chip ol-chip--streak"></span>
      <div id="child-chip" class="session-child-chip"></div>
    </div>
  </div>
</header>

<main class="page-main ollie-content">
  <!-- Today's goal. It used to be a footer bar; nothing may sit fixed at the bottom now
       that Ollie lives in that corner. -->
  <p id="page-foot" class="page-foot-note"></p>
  <div id="demo-banner" class="session-banner" hidden>
    <span aria-hidden="true">🧪</span>
    <span><b>Demo session</b> — no child profile is set up yet. Your answers won't be saved. <a href="/dashboard.html" class="underline">Set up a profile →</a></span>
  </div>

  <!-- Single-column screens: loading, error, feedback, start, close, lesson, review. -->
  <div id="stage-single"></div>

  <!-- Split screens: teach + question. One centred column at every width (Ollie lives in
       the bottom-left dock, not beside the content). Head, then side, then action;
       placeAction() nests #stage-action under #stage-head so the question card holds the
       title, the answer box and the clues. -->
  <div id="stage-split" class="session-split" hidden>
    <div id="stage-left" class="stage-col">
      <section id="stage-head" class="stage-col"></section>
    </div>
    <section id="stage-side" class="stage-col"></section>
    <section id="stage-action" class="stage-col"></section>
  </div>
</main>
<script src="/answer.js"></script>
<script src="/session-shape.js"></script>
<script src="/ollie-lines.js"></script>
<script src="/scene.js"></script>
<script src="/speech.js"></script>
<script src="/ollie-kit/ollie/ollie-character.js"></script>
<script src="/ollie-kit/ollie/ollie-dock.js"></script>
<script src="/ollie-kit/ollie/ollie-clues.js"></script>
<script src="/ollie-voice.js"></script>
<script>
(function(){
  "use strict";

  function setVVH(){
    var vv = window.visualViewport;
    document.documentElement.style.setProperty('--vvh', (vv ? vv.height : window.innerHeight) + 'px');
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setVVH);
    window.visualViewport.addEventListener('scroll', setVVH);
  }
  window.addEventListener('resize', setVVH);
  setVVH();

  var SESSION = null;

  /* ── answer normalisation + marking ──────────────────────────────── */
  // public/answer.js holds the one definition, shared with
  // scripts/test-answer-matching.js. Read its header for why a word answer is
  // marked on the maths and not the spelling — it is the reason a real session
  // was abandoned three questions in.
  var normalise = Answer.normalise;
  var correct   = Answer.correct;

  /* ── DOM helpers ─────────────────────────────────────────────────── */
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function h(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }

  /* ── SVG icons — /public/assets/icons|ollie|progress ────────────────
   * Fetched once at boot and cached as raw markup so Tailwind classes
   * (sizing, text-color for stroke="currentColor") apply the same way
   * they would to an inline <svg>. An <img src="..."> can't pick up
   * currentColor, which is why these are inlined rather than referenced. */
  var ICON_FILES = {
    star: '/assets/icons/star.svg',
    streakFlame: '/assets/icons/streak-flame.svg',
    goalTarget: '/assets/icons/goal-target.svg',
    clueBulb: '/assets/icons/clue-bulb.svg',
    lock: '/assets/icons/lock.svg',
    check: '/assets/icons/check.svg',
    clock: '/assets/icons/clock.svg',
    lessonColumns: '/assets/icons/lesson-columns.svg',
    lessonBook: '/assets/icons/lesson-book.svg',
    arrowRight: '/assets/icons/arrow-right.svg',
    replay: '/assets/icons/replay.svg',
    speaker: '/assets/icons/speaker.svg',
    pause: '/assets/icons/pause.svg'
  };
  var ICON_CACHE = {};
  function loadIcons(){
    return Promise.all(Object.keys(ICON_FILES).map(function(key){
      return fetch(ICON_FILES[key]).then(function(r){ return r.ok ? r.text() : ''; })
        .then(function(svg){ ICON_CACHE[key]=svg; })
        .catch(function(){ ICON_CACHE[key]=''; });
    }));
  }
  function icon(name, cls){
    var svg = ICON_CACHE[name];
    if(!svg) return '';
    return svg.replace('<svg', '<svg class="'+(cls||'')+' shrink-0"');
  }

  // Coach Ollie lives in a dock, bottom-left, and speaks through `speaker`
  // (public/ollie-voice.js): a bubble that fades on its own, a recording when there is
  // one. If the kit or that file did not load, this no-op stand-in keeps every screen
  // below working — the child just gets no Ollie.
  var speaker = { say:function(){}, sayText:function(){}, chain:function(){}, stop:function(){},
    setQuestion:function(){}, remap:null, isSpeaking:function(){ return false; } };
  var dock = null;

  /* ── API helpers ─────────────────────────────────────────────────── */
  // Every /api call carries the child key (app.js "Authentication"). It is
  // stored per device, so the parent types it once on the iPad and never
  // again. This is the CHILD key: it reaches only the three routes below, so
  // a borrowed iPad cannot read the dashboard or delete anything.
  var KEY_STORE = 'tutorChildKey';
  function tutorKey(){
    try { return localStorage.getItem(KEY_STORE) || ''; } catch(e){ return ''; }
  }
  function setTutorKey(k){
    try { localStorage.setItem(KEY_STORE, k); } catch(e){}
  }
  function apiFetch(url, opts){
    opts = opts || {};
    var headers = {};
    for(var h in (opts.headers||{})) headers[h] = opts.headers[h];
    headers['x-tutor-key'] = tutorKey();
    opts.headers = headers;
    return fetch(url, opts);
  }

  // Every answer goes to the server as it happens, IN ORDER, and is kept until the
  // server confirms it. A send that fails is not dropped: it waits at the front of
  // the queue and everything behind it waits too. Order matters — the grader reads a
  // question's FIRST recorded try as the unaided one, so a retry must never land a
  // second try ahead of the first. Each attempt carries a clientId, so if a send
  // succeeded but its reply was lost, sending it again is harmless (the server
  // acknowledges a repeat and stores it once). The last screen says so if anything
  // is still unsent. Used to be `.catch(function(){})`: a failed send did nothing,
  // and 30 minutes of work reached no one while the screen looked fine.
  // shortcut: the queue lives in memory — a reload during an outage loses what was
  // unsent, and the page then resumes from what the server holds.
  var sendQueue = [], inflight = null;
  function newClientId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
  function flushQueue(){
    if(inflight) return inflight;
    if(!sendQueue.length) return Promise.resolve();
    inflight = (function next(){
      if(!sendQueue.length) return Promise.resolve();
      var it = sendQueue[0];
      return apiFetch(it.url, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(it.body)
      }).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        sendQueue.shift();
        return next();
      });
    })().then(function(){}, function(){}).then(function(){ inflight = null; });
    return inflight;
  }
  function enqueue(url, body){ sendQueue.push({url:url, body:body}); return flushQueue(); }

  function postAttempt(data){
    if(SESSION) (SESSION.attempts = SESSION.attempts || []).push(data);
    if(!SESSION || SESSION.demo) return;
    data.clientId = newClientId();
    enqueue('/api/sessions/'+SESSION.id+'/attempts', data);
  }
  function postFinish(summary){
    if(!SESSION || SESSION.demo) return Promise.resolve();
    return enqueue('/api/sessions/'+SESSION.id+'/finish', summary);
  }

  /* ── state ───────────────────────────────────────────────────────── */
  var state = {screen:'loading', i:0, tries:0, hintsShown:0, result:null,
               teachStep:{}, lastGiven:'', log:[], fbSeen:{}, startedAt: Date.now(),
               reviewing:false, reviewStep:0, angleSeen:{}, chartOpen:{},
               streak:0, streakShown:0, resumeStep:-1};
  var steps = [];
  var RESUME_AT = 0;
  var firstPracticeStepIdx = -1;

  /* ── Coach Ollie — the single voice ──────────────────────────────────
   * register() decides how much Ollie is allowed to say, from uiMode —
   * never from SESSION.kind string-matching. See docs/mascot.md §3. */
  function computeRegister(S){
    var u = S.uiMode || {};
    if (u.retryPolicy === 'oneShot' || u.allowReveal === false) return 'assessment';
    return S.teach ? 'teaching' : 'practice';
  }
  var REGISTER = 'practice';

  // How the page speaks. q.ollie (an authored line for one question) is handled in
  // ollie-voice.js — it only replaces the plain fresh/wrong/right moments, never the
  // structural ones. A click that opens a new screen can set a lead-in ('start',
  // 'feedback.done'): the screen's own opener then waits for it to finish.
  var leadIn = null;
  function speakAll(items){
    if(leadIn){ items = [{moment:leadIn}].concat(items); leadIn = null; }
    if(items.length===1 && !items[0].text) speaker.say(items[0].moment, items[0].o);
    else speaker.chain(items);
  }
  function say(moment, o){ speakAll([{moment:moment, o:o}]); }
  // A screen is drawn again for every change. Only a NEW screen, question or teach step
  // may open with a line; after an answer, Ollie reacts through the clue track instead.
  var openerSig = '';
  function isNewScreen(sig){ if(sig===openerSig) return false; openerSig = sig; if(speaker && speaker.newScreen) speaker.newScreen(); return true; }

  function oneShotSession(){
    if(SESSION.uiMode && SESSION.uiMode.retryPolicy) return SESSION.uiMode.retryPolicy==='oneShot';
    return SESSION.kind==='placement';
  }

  function buildSteps(S){
    steps = [];
    S.warmup.items.forEach(function(q,i){
      steps.push({kind:'q', phase:'warm', q:q, label:'Warm-up '+(i+1),
                  phaseIndex:i+1, phaseTotal:S.warmup.items.length});
    });
    var teach = SessionShape.normalizeTeach(S);
    if(teach){
      var n = teach.cycles.length;
      teach.cycles.forEach(function(c,ci){
        steps.push({kind:'teach', phase:'teach', cycle:c, cycleIndex:ci, cycleCount:n,
                    title:teach.title});
        if(c.q){
          steps.push({kind:'q', phase:'teach', guided:true, cycle:c, cycleIndex:ci,
                      q:c.q, label: n>1 ? ('You try — part '+(ci+1)) : 'You try'});
        }
      });
    }
    S.practice.forEach(function(q,i){
      steps.push({kind:'q', phase:'practice', q:q, label:'Practice '+(i+1),
                  phaseIndex:i+1, phaseTotal:S.practice.length});
    });
    var qCount = steps.filter(function(s){ return s.kind==='q'; }).length;
    state.log = new Array(qCount).fill(null);
    state.halfwayShown = false;

    firstPracticeStepIdx = -1;
    steps.forEach(function(st,i){
      if(firstPracticeStepIdx<0 && st.kind==='q' && st.phase==='practice') firstPracticeStepIdx=i;
      if(st.kind==='teach' && !(steps[i+1] && steps[i+1].kind==='q'))
        console.error('session-shape: teach block at step '+i+' has no question after it — resume will stall here.');
    });
  }

  function qIndex(stepIdx){
    var n=0;
    for(var k=0;k<stepIdx;k++){ if(steps[k].kind==='q') n++; }
    return n;
  }
  function totalQuestions(){ return state.log.length; }

  function prevQStep(idx){
    for(var k=idx-1;k>=0;k--){ if(steps[k].kind==='q') return k; }
    return -1;
  }
  function nextQStep(idx, maxExclusive){
    for(var k=idx+1;k<maxExclusive;k++){ if(steps[k].kind==='q') return k; }
    return -1;
  }

  function resumeFromAttempts(){
    var lastByQ={};
    (SESSION.attempts||[]).forEach(function(a){ lastByQ[a.questionId]=a; });
    (SESSION.attempts||[]).forEach(function(a){
      if(a.secondAngleShown) state.angleSeen[a.questionId]=true;
    });
    var oneShot = oneShotSession();
    for(var i=0;i<steps.length;i++){
      var st=steps[i];
      if(st.kind==='teach'){
        var nxt=steps[i+1], nxtQid=nxt && nxt.kind==='q' && (nxt.q.id || ('q_'+qIndex(i+1)));
        if(!nxtQid || !lastByQ[nxtQid]) return i;
        continue;
      }
      if(st.kind!=='q') continue;
      var qi=qIndex(i), qid=st.q.id || ('q_'+qi);
      var a=lastByQ[qid];
      if(!a){ return i; }
      var resolved = oneShot || a.correct || a.revealed || a.exhausted;
      if(!resolved){
        state.tries = a.tries || 0;
        state.hintsShown = a.hintsUsed || 0;
        return i;
      }
      state.log[qi] = a.revealed ? 'shown' : a.exhausted ? 'exhausted'
                    : !a.correct ? 'wrong' : (a.tries===1 ? 'first' : 'retry');
    }
    return steps.length;
  }

  /* ── stage elements ──────────────────────────────────────────────── */
  var dotsEl = document.getElementById('dots');
  var topicNameEl = document.getElementById('topic-name');
  var topicCounterEl = document.getElementById('topic-counter');
  var stageSingleWrap = document.getElementById('stage-single');
  var stageSplitWrap  = document.getElementById('stage-split');
  var stageLeft   = document.getElementById('stage-left');
  var stageHead   = document.getElementById('stage-head');
  var stageSide   = document.getElementById('stage-side');
  var stageAction = document.getElementById('stage-action');

  // One column at every width: #stage-action nests under #stage-head inside stage-left, so
  // the question card holds the title, the answer box and the clues beneath it, and
  // whatever is left in #stage-side (second angle, golden rule, week) follows below.
  function placeAction(){
    if(stageSplitWrap.hidden) return;
    if(stageAction.parentElement !== stageLeft) stageLeft.appendChild(stageAction);
  }

  function setTopicHeader(name){
    topicNameEl.textContent = name || '';
    var eye = document.getElementById('topic-eyebrow');
    if(eye){
      var kindLabel = { practice:'Practice', lesson:'Learn', check:'Check', retest:'Check' }[SESSION && SESSION.kind] || '';
      var group = SESSION && SESSION.topicGroup ? String(SESSION.topicGroup).split(',')[0].trim() : '';
      eye.textContent = [kindLabel, group].filter(Boolean).join(' · ');
    }
    var mark = document.getElementById('topic-mark');
    if(mark && !mark.innerHTML) mark.innerHTML = icon('lessonColumns','ol-icon');
  }
  function setCounter(text){ if(topicCounterEl) topicCounterEl.textContent = text || ''; }

  // Today's goal, in Ollie's own target icon — the one thing a child should
  // be able to answer if asked "what are you learning today?". SESSION.goal
  // is the field a future agent update can author directly; topicDescription
  // is today's stand-in so this isn't empty until that lands.
  function paintFooter(){
    var el = document.getElementById('page-foot');
    if(!el) return;
    if(!SESSION){ el.innerHTML = ''; return; }
    var goalText = SESSION.goal || SESSION.topicDescription || SESSION.topicName || '';
    if(!goalText){ el.innerHTML = ''; return; }
    el.innerHTML = icon('goalTarget', 'ol-icon') +
      '<span><b>Today\'s goal:</b> '+esc(goalText)+'</span>';
  }

  // Child identity + streak — static chrome, painted once per session load
  // (not per render(), since it never changes mid-session) right after
  // SESSION is set. Cleared for a demo session (no real child, nothing to
  // show) and left untouched by every other render() call.
  function yearFromStage(stage){
    var m = String(stage||'').match(/(?:Stage|Class|Year)\s*(\d+)/i);
    return m ? ('Year '+m[1]) : '';
  }
  function paintChildChip(){
    var streakEl = document.getElementById('streak');
    var chipEl = document.getElementById('child-chip');
    if(!SESSION || SESSION.demo){
      if(streakEl) streakEl.innerHTML='';
      if(chipEl) chipEl.innerHTML='';
      return;
    }
    if(streakEl)
      streakEl.innerHTML = SESSION.streak>0 ? (icon('streakFlame','')+SESSION.streak+'-day streak') : '';
    if(chipEl){
      if(SESSION.childName){
        var first = SESSION.childName.trim().split(/\s+/)[0];
        var initial = first.charAt(0).toUpperCase();
        var yearLabel = yearFromStage(SESSION.childStage);
        chipEl.innerHTML = '<div class="ol-avatar">'+esc(initial)+'</div>'+
          '<div class="child-name-stack"><b>'+esc(first)+'</b>'+
          (yearLabel ? '<span>'+esc(yearLabel)+'</span>' : '')+'</div>';
      } else chipEl.innerHTML='';
    }
  }

  // Macro step indicator ("① Look back ② Learn ③ Practice") — which major
  // part of TODAY's session the child is in, distinct from the dots'
  // per-question progress within one part. Only shown where there's a real
  // multi-part journey to map: hidden entirely in the assessment register
  // (a check/placement must read as one plain set of questions, never a
  // staged journey — CLAUDE.md "must be indistinguishable from a practice
  // session") and on screens with no session underway.
  function macroStepsList(){
    var list = [];
    if(SESSION.feedback && SESSION.feedback.length) list.push({ key:'feedback', label:'Look back' });
    // "Learn" is only a real lesson (teach.cycles). A warm-up in a practice
    // session is not one — those questions belong with Practice.
    if(SESSION.teach) list.push({ key:'learn', label:'Learn' });
    list.push({ key:'practice', label:'Practice' });
    return list;
  }
  function currentMacroKey(){
    if(state.screen==='feedback') return 'feedback';
    if(state.screen==='lesson') return 'learn';
    var s = steps[state.i];
    if(!s) return 'practice';
    return s.phase==='teach' ? 'learn' : 'practice';
  }
  // Per-question stones. "Learn" is only the guided questions of a real
  // lesson. Warm-up questions in a practice session are numbered into that
  // same Practice row — the session has no lesson to put them under.
  function progressStonesHtml(){
    var learn = [], practice = [], qi = 0;
    // On a teach step the guided question hasn't started, but it is the
    // stone this part belongs to — the ring sits on it until it's answered.
    var cur = -1;
    if(steps[state.i] && steps[state.i].kind==='q') cur = qIndex(state.i);
    else if(steps[state.i] && steps[state.i].kind==='teach'){
      for(var k=state.i+1;k<steps.length;k++){
        if(steps[k].kind==='q'){ cur = qIndex(k); break; }
      }
    }
    steps.forEach(function(st){
      if(st.kind!=='q') return;
      var item = { qi: qi, phase: st.phase };
      qi++;
      if(st.phase==='teach') learn.push(item);
      else practice.push(item);
    });
    function stone(item, n, asLearn){
      var log = state.log[item.qi];
      if(item.qi===cur) return '<span class="ol-qstone" data-state="current" aria-current="step">'+n+'</span>';
      if(!log) return '<span class="ol-qstone">'+n+'</span>';
      if(asLearn) return '<span class="ol-qstone" data-state="done">'+icon('check','ol-icon')+'</span>';
      if(log==='first') return '<span class="ol-qstone" data-state="star">'+icon('star','ol-icon')+'</span>';
      return '<span class="ol-qstone" data-state="helped">'+icon('check','ol-icon')+'</span>';
    }
    function group(label, items, asLearn){
      return '<div class="ol-qprogress-group"><span class="ol-qprogress-label">'+esc(label)+'</span><span class="ol-qstones">'+
        items.map(function(item, i){ return stone(item, i+1, asLearn); }).join('')+'</span></div>';
    }
    var html = '<div class="ol-qprogress">';
    if(learn.length) html += group('Learn', learn, true);
    if(learn.length && practice.length) html += '<span class="ol-qprogress-rule" aria-hidden="true"></span>';
    if(practice.length){
      var here = -1;
      practice.forEach(function(p, i){ if(p.qi===cur) here = i; });
      var label = here>=0 ? ('Practice · question '+(here+1)+' of '+practice.length) : 'Practice';
      html += group(label, practice, false);
    }
    return html+'</div>';
  }
  function renderMacroSteps(){
    var el = document.getElementById('macro-steps');
    if(!el) return;
    if(!SESSION || REGISTER==='assessment' ||
       state.screen==='start' || state.screen==='close' || state.screen==='loading'){
      el.innerHTML=''; return;
    }
    if(state.screen==='run' || state.screen==='lesson'){
      // A teach walkthrough names its parts ("Comma rule"), which is what
      // the header shows while that explanation is on screen. Question
      // stones return as soon as a question is the current step.
      var chips = state.screen==='run' ? learnCycleChipsHtml() : '';
      el.innerHTML = chips || progressStonesHtml();
      return;
    }
    var list = macroStepsList();
    if(list.length<2){ el.innerHTML=''; return; }
    var curKey = currentMacroKey(), curIdx=-1;
    list.forEach(function(m,i){ if(m.key===curKey) curIdx=i; });
    el.innerHTML = '<ol class="ol-steps">'+list.map(function(m,i){
      var attrs = i===curIdx ? ' aria-current="step"' : (i<curIdx ? ' data-state="done"' : '');
      var num = i<curIdx ? icon('check','ol-icon') : String(i+1);
      return '<li class="ol-steps__item"'+attrs+'><span class="ol-steps__dot">'+num+'</span>'+esc(m.label)+'</li>';
    }).join('')+'</ol>';
  }

  function renderDots(){
    if(!dotsEl) return;
    var phaseLabelEl = document.getElementById('phase-label');
    var starsEl = document.getElementById('stars');
    if(state.screen==='loading'||state.screen==='start'||state.screen==='close'){
      dotsEl.innerHTML=''; if(phaseLabelEl) phaseLabelEl.textContent=''; if(starsEl) starsEl.innerHTML='';
      return;
    }
    var cur = qIndex(state.i);
    dotsEl.innerHTML = state.log.map(function(r,i){
      var cls = 'w-8 h-1.5 rounded-full ';
      if(r==='first') cls += 'bg-app-sage';
      else if(r==='retry' || r==='wrong') cls += 'bg-app-peachBorder';
      else if(i===cur) cls += 'bg-app-sage/70 ring-2 ring-app-sageLight';
      else cls += 'bg-app-dot';
      return '<span class="'+cls+'"></span>';
    }).join('');
    // A1/A5 — which phase the child is in right now, so the dots read as a
    // map of the session rather than an anonymous progress bar.
    if(phaseLabelEl){
      var curStep = steps[state.i];
      phaseLabelEl.textContent = curStep ? (PHASE_LABEL[curStep.phase] || '') : '';
    }
    // A2 — first-try stars earned so far this session.
    if(starsEl){
      var starCount = state.log.filter(function(r){ return r==='first'; }).length;
      starsEl.innerHTML = starCount>0 ? (icon('star','') + starCount) : '';
    }
  }

  // Single card wrapper every "single-column" screen (start, close, loading,
  // feedback, lesson, review, error) renders into.
  function singleCard(){
    stageSingleWrap.hidden = false;
    stageSplitWrap.hidden = true;
    stageSingleWrap.innerHTML = '';
    var card = h('<div class="enter session-card"></div>');

  }

    stageSplitWrap.classList.toggle('is-solo', !!on);

  function openSplit(){
