  function badge(text, warm){
    return '<span class="q-badge enter inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase '+
      (warm ? 'text-app-muted bg-app-grayBox' : 'text-app-muted bg-white border border-app-border') +
      '"><span class="w-1.5 h-1.5 rounded-full '+(warm?'bg-app-muted':'bg-app-sage')+'"></span>'+esc(text)+'</span>';
  }

  var BTN_PRIMARY = 'inline-flex items-center justify-center gap-2 h-12 px-6 rounded-2xl bg-app-sage hover:bg-app-sageHover ' +
    'text-white font-bold text-[15px] shadow-sm transition active:scale-[0.98]';
  var BTN_SECONDARY = 'inline-flex items-center justify-center gap-2 h-12 px-5 rounded-2xl bg-app-grayBox hover:bg-app-grayHover ' +
    'text-app-dark font-semibold text-[14px] transition active:scale-[0.98]';
  var BTN_QUIET = 'text-app-muted hover:text-app-dark text-[13px] font-semibold underline-offset-2 hover:underline transition';

  // Not a grid. The number renders as ONE string, the way a number actually
  // is written ("305,020"), inside a single plain card. A column being
  // talked about is coloured, lifted, and flagged with its name above it; a
  // column that is NOT being talked about is just a plain digit — the only
  // label on screen is the one a step is actually pointing at.
  function pvHtml(cols, lit){
    var onesIdx=-1;
    cols.forEach(function(c,i){ if(/^ones$/i.test(c[0])) onesIdx=i; });
    var decStart = onesIdx>=0 ? onesIdx+1 : cols.length;
    var hasDigits = cols.some(function(c){ return c[1]; });

    if(!hasDigits){
      var leg='<div class="enter pv-legend">';
      cols.forEach(function(c,i){
        if(i>0 && i===decStart) leg+='<span class="text-app-muted font-bold">·</span>';
        leg+='<span class="text-[11px] font-bold tracking-wide uppercase text-app-muted/90">'+esc(c[0])+'</span>';
      });
      return leg+'</div>';
    }

    var comma={};
    if(decStart>0){
      var p=decStart%3 || 3;
      while(p<decStart){ comma[p]=true; p+=3; }
    }
    for(var q=decStart+3; q<cols.length; q+=3) comma[q]=true;

    var few = lit.length>0 && lit.length<cols.length;

    var out='<div class="enter pv-figure'+(lit.length?' pv-figure-tagged':'')+'">';
    cols.forEach(function(c,i){
      if(i===decStart && i>0) out+='<span class="pv-sep">.</span>';
      else if(comma[i]) out+='<span class="pv-sep">,</span>';
      var isLit=lit.indexOf(i)>=0;
      if(isLit){
        out+='<span class="pv-digit pv-lit" data-lit>'+
          '<span class="pv-digit__label">'+esc(c[0])+'</span>'+esc(c[1]||'0')+'</span>';
      } else {
        out+='<span class="pv-digit'+(few?'':' pv-digit--plain')+'">'+esc(c[1]||'0')+'</span>';
      }
    });
    return out+'</div>';
  }

  // The literal grid-table place-value chart — reserved for the optional
  // "Show place value chart" escalation only, never the primary display.
  // Highlights the SAME lit[] the primary view uses, nothing more: this is a
  // deeper look at the same picture, not a new way to give the answer away.
  // Short column abbreviations for the table header, matching the
  // reference's own convention (H-TH / T-TH / TH / H / T / O). A naive
  // first-letter scheme collides Thousands and Tens into the same 'T' —
  // this is an explicit lookup for the fixed place-value vocabulary instead.
  var PV_ABBR = {
    'hundred-thousands':'H-TH', 'ten-thousands':'T-TH', 'thousands':'TH',
    'hundreds':'H', 'tens':'T', 'ones':'O',
    'tenths':'t', 'hundredths':'h', 'thousandths':'th'
  };
  function pvAbbr(label){
    var k = String(label||'').toLowerCase();
    return PV_ABBR[k] || String(label||'').slice(0,2).toUpperCase();
  }
  function pvTableHtml(cols, lit){
    var head='', body='';
    cols.forEach(function(c,i){
      var on = lit.indexOf(i)>=0;
      var cell = 'pv-cell' + (on ? ' pv-cell-on' : '');
      head += '<div class="'+cell+'" title="'+esc(c[0]||'')+'">'+esc(pvAbbr(c[0]))+'</div>';
      body += '<div class="'+cell+'">'+esc(c[1]||'0')+'</div>';
    });
    var colsStyle = 'style="grid-template-columns:repeat('+cols.length+',minmax(0,1fr))"';
    return '<div class="pv-table">' +
      '<div class="pv-table-head" '+colsStyle+'>'+head+'</div>' +
      '<div class="pv-table-body" '+colsStyle+'>'+body+'</div>' +
      '</div>';
  }

  function fractionBarsHtml(v){
    var bars = Array.isArray(v.bars) ? v.bars : [];
    if(!bars.length) return '';
    var out='<div class="enter flex flex-col gap-3">';
    bars.forEach(function(b){
      var parts  = Math.max(1, parseInt(b.parts,10)  || 1);
      var shaded = Math.min(parts, Math.max(0, parseInt(b.shaded,10) || 0));
      out += '<div class="flex flex-col gap-1.5">';
      if(b.label) out += '<span class="font-bold text-app-dark">'+esc(b.label)+'</span>';
      out += '<div class="flex gap-0.5 w-full">';
      for(var i=0;i<parts;i++) out += '<span class="flex-1 min-w-0 h-8 rounded border border-app-border '+(i<shaded?'bg-app-sage border-app-sage':'bg-app-grayBox')+'"></span>';
      out += '</div></div>';
    });
    if(v.caption) out += '<div class="text-sm text-app-muted text-center mt-1">'+esc(v.caption)+'</div>';
    return out+'</div>';
  }

  function visualHtml(v){
    if(!v || !v.type) return '';
    if(v.type==='placeValue')   return pvHtml(v.cols||[], v.lit||[]);
    if(v.type==='fractionBars') return fractionBarsHtml(v);
    if(v.type==='scene')        return sceneHtml(v);
    return '';
  }

  // A scene is drawn by public/scene.js, the same module verify-session.js
  // measures it with. If the script failed to load or the scene is invalid it
  // draws nothing, like an unknown type — never half a picture.
  function sceneHtml(v){
    if(typeof SceneLib==='undefined') return '';
    try { var s = SceneLib.html(v); return s ? '<div class="enter">'+s+'</div>' : ''; }
    catch(e){ return ''; }
  }

  // Lets the question/teach renderer offer "Show place value chart" under
  // whatever visual it already drew, reusing the same cols/lit — no new data.
  // Appends the "Show place value chart" toggle INTO an existing card
  // (helpCard — the same card the hints/placeholder live in), with a
  // divider above it when that card already has content, matching the
  // reference where the toggle sits inside the hint card, not as its own
  // box. The expanded chart itself is a separate card, appended as
  // helpCard's next sibling, since it is genuinely optional/extra content.
  function appendChartToggle(sideCard, visual, key){
    if(!visual || visual.type!=='placeValue' || !(visual.cols||[]).some(function(c){return c[1];})) return;
    var hasContentAbove = sideCard.children.length>0;
    var row = h('<div class="card-split'+(hasContentAbove?'':' is-first')+'"></div>');
    var toggle = h('<button type="button" class="'+BTN_QUIET+' inline-flex items-center gap-1.5">'+
      '<svg class="w-3.5 h-3.5 stroke-current fill-none shrink-0" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>'+
      '<span>'+(state.chartOpen[key]?'Hide place value chart':'Show place value chart')+'</span></button>');
    toggle.addEventListener('click', function(){ state.chartOpen[key]=!state.chartOpen[key]; render(); });
    row.appendChild(toggle);
    // "Help is always free" used to sit here, unattributed — dropped rather
    // than attributed to Ollie: the sentiment already lives in her stuck
    // lines, and a toggle row isn't a sentence she needs to say twice.
    sideCard.appendChild(row);
    if(state.chartOpen[key]){
      var chart = h('<div class="enter side-card"></div>');
      chart.appendChild(h('<div class="chart-label">Place value columns</div>'));
      chart.appendChild(h(pvTableHtml(visual.cols, visual.lit||[])));
      sideCard.parentElement.insertBefore(chart, sideCard.nextSibling);
    }
  }

  /* ── screens ─────────────────────────────────────────────────────── */
  // Draw the screen. Whatever it says, it says while drawing (see say / isNewScreen). A
  // lead-in nothing picked up (a silent next screen) is spoken here, on its own.
  function render(){
    renderScreen();
    if(leadIn){ var l = leadIn; leadIn = null; speaker.say(l); }
  }
  function renderScreen(){
    renderDots();
    renderMacroSteps();
    paintFooter();
    var mainEl = document.querySelector('.page-main');
    var isStart = state.screen==='start' && !state.reviewing;
    if(mainEl){
      mainEl.classList.toggle('is-lookback', state.screen==='feedback' && !state.reviewing);
      mainEl.classList.toggle('is-start', isStart);
    }
    var topicBrand = document.getElementById('brand-topic');
    var startBrand = document.getElementById('brand-start');
    if(topicBrand) topicBrand.hidden = isStart;
    if(startBrand) startBrand.hidden = !isStart;
    if(state.reviewing)           return reviewQuestion();
    if(state.screen==='loading')  return loading();
    if(state.screen==='unlock')   return unlock();
    if(state.screen==='error')    return error(state.errorMsg);
    if(state.screen==='feedback') return feedback();
    if(state.screen==='lesson')   return lesson();
    if(state.screen==='start')    return start();
    if(state.screen==='close')    return close();
    var s = steps[state.i];
    if(!s){ state.screen='close'; return close(); }
    setCounter('Question '+(qIndex(state.i)+1)+' of '+totalQuestions());
    if(s.kind==='teach') return teach();
    return question(s);
  }

  function loading(){
    var card = singleCard();
    card.appendChild(h('<div class="text-center py-10 text-app-muted font-semibold">Loading your session…</div>'));
  }

  function error(msg){
    var card = singleCard();
    card.appendChild(h('<div class="bg-app-peachBg border border-app-peachBorder rounded-xl p-4 flex flex-col gap-2">'+
      '<b class="text-app-peachText">Something went wrong</b><div>'+esc(msg||'Could not load the session.')+'</div></div>'));
    var b = h('<button type="button" class="'+BTN_PRIMARY+'">Try again</button>');
    b.addEventListener('click', function(){ location.reload(); });
    card.appendChild(b);
  }

  // Shown when the API rejects our key (401) — a first visit on a new device,
  // or a rotated key. Deliberately a grown-up screen, not an Ollie one: this
  // is the parent's job and nothing is wrong with the child or their work.
  function unlock(){
    var card = singleCard();
    card.appendChild(h('<h1 class="text-center text-[22px] font-extrabold tracking-tight">One-time setup</h1>'));
    card.appendChild(h('<p class="text-app-muted text-[14px] max-w-[34ch] mx-auto text-center">'+
      'Ask a grown-up to enter the access key for this device. It only needs doing once.</p>'));
    var inp = h('<input type="password" inputmode="text" autocomplete="off" spellcheck="false" '+
      'class="w-full h-12 px-4 rounded-2xl border border-app-line text-[16px]" placeholder="Access key">');
    var msg = h('<div class="text-app-peachText text-[13px] text-center" hidden></div>');
    var go = h('<button type="button" class="'+BTN_PRIMARY+' w-full">Unlock</button>');
    function submit(){
      var v = (inp.value||'').trim();
      if(!v){ inp.focus(); return; }
      setTutorKey(v);
      location.reload();
    }
    go.addEventListener('click', submit);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
    if(tutorKey()){
      msg.hidden = false;
      msg.textContent = 'That key was not accepted. Please check it and try again.';
    }
    card.appendChild(inp); card.appendChild(msg); card.appendChild(go);
    if(dotsEl) dotsEl.innerHTML='';
    setTimeout(function(){ inp.focus(); }, 50);
  }

  // "Look back" — one item in focus at a time (matching the "LOOK BACK 1 OF
  // 2" badge), not every card stacked at once. `lastTry`/`remember`/`visual`
  // are optional structured fields (CLAUDE.md "Session shape"); an item
  // authored before they existed has none of them and falls back to
  // rendering its `body` blob exactly as it always has — nothing breaks on
  // old stored feedback.
  // Place-value diagram for look-back, drawn as digit boxes. A written
  // digit is "given", a 0 is "zero" (the empty column), a blank is "empty".
  // Same columns and labels as pvHtml — only the look-back screen uses this.
  // Whole-number column names, rightmost first. Same names pvAbbr already uses.
  var WHOLE_PLACES = ['ones','tens','hundreds','thousands','ten-thousands','hundred-thousands','millions'];
  function placeLabels(n){
    var labels = [];
    for(var i=n-1; i>=0; i--) labels.push(WHOLE_PLACES[i] || '');
    return labels;
  }
  function digitBoxes(cells, caption){
    var n = cells.length;
    var labels = placeLabels(n);
    var html = '<div class="ol-bg-muted ol-rounded-xl ol-p-6 ol-lookback-panel"><div class="ol-digits ol-justify-center">';
    cells.forEach(function(cell, i){
      if(i>0 && (n-i)%3===0) html += '<span class="ol-digit-sep" aria-hidden="true">,</span>';
      html += '<div class="ol-digit-col"><span class="ol-digit-col__label">'+esc(pvAbbr(labels[i]))+'</span>'+
        '<span class="ol-digit ol-digit--'+cell.tone+'">'+esc(cell.ch)+'</span></div>';
    });
    html += '</div>';
    if(caption) html += '<p class="ol-text-secondary ol-text-center ol-mb-0">'+esc(caption)+'</p>';
    html += '</div>';
    return html;
  }
  // A legacy feedback body is one HTML blob. Pull the "you wrote" line, any
  // digit/blank pattern or number it already states, and the rule, and draw
  // those as the same digit boxes and remember card the structured cards use.
  function parseLegacyBody(bodyHtml){
    var root = document.createElement('div');
    root.innerHTML = bodyHtml || '';
    var ruleEl = root.querySelector('.rule');
    var rule = '';
    if(ruleEl){
      rule = (ruleEl.textContent || '').replace(/^[^A-Za-z0-9]+/, '').trim();
      ruleEl.remove();
    }
    var html = root.innerHTML.replace(/<br\s*\/?>/gi, '\n');
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    var lines = (tmp.textContent || '').split('\n').map(function(s){
      return s.replace(/\s+/g, ' ').trim();
    }).filter(Boolean);
    var wrote = null, verb = 'wrote';
    if(lines.length && /^you (wrote|said)\b/i.test(lines[0])){
      verb = /said/i.test(lines[0]) ? 'said' : 'wrote';
      var wm = lines[0].match(/([0-9][0-9,]*)/);
      if(wm) wrote = wm[1];
      lines.shift();
    }
    var cells = null;
    var patternLine = -1;
    for(var i=0; i<lines.length; i++){
      var pm = lines[i].match(/(?:^|:\s*)((?:\d|_)\s+(?:\d|_)\s+(?:\d|_)(?:\s+(?:\d|_))*)/);
      if(pm){
        patternLine = i;
        cells = pm[1].trim().split(/\s+/).map(function(tok){
          if(tok==='_' || tok==='0') return { ch: tok==='_' ? '0' : tok, tone: 'zero' };
          return { ch: tok, tone: 'given' };
        });
        break;
      }
    }
    if(!cells){
      var joined = lines.join(' ');
      var nums = joined.match(/\d{1,3}(?:,\d{3})+|\d{4,}/g);
      var nth = joined.match(/(\d+)(?:st|nd|rd|th)\s+digit/i);
      var answer = null;
      var bolds = root.querySelectorAll('b');
      for(var b=bolds.length-1; b>=0; b--){
        var bt = (bolds[b].textContent || '').trim();
        if(/^\d$/.test(bt)){ answer = bt; break; }
      }
      if(nums && nums.length && nth){
        var digits = nums[nums.length-1].replace(/,/g, '');
        var fromRight = parseInt(nth[1], 10);
        cells = digits.split('').map(function(ch, idx){
          var place = digits.length - idx;
          var tone = place===fromRight ? 'target' : (ch==='0' ? 'zero' : 'dim');
          if(place===fromRight && answer && ch!==answer) tone = ch==='0' ? 'zero' : 'dim';
          return { ch: ch, tone: tone };
        });
      }
    }
    var captionLines = lines.filter(function(line, idx){ return idx!==patternLine; });
    return { wrote: wrote, verb: verb, cells: cells, caption: captionLines.join(' '), rule: rule };
  }

  function lookbackDigits(v){
    if(!v || v.type!=='placeValue') return '';
    var cols = v.cols || [];
    if(!cols.some(function(c){ return c[1]; })) return '';
    var onesIdx=-1;
    cols.forEach(function(c,i){ if(/^ones$/i.test(c[0])) onesIdx=i; });
    var decStart = onesIdx>=0 ? onesIdx+1 : cols.length;
    var comma={};
    if(decStart>0){
      var p=decStart%3 || 3;
      while(p<decStart){ comma[p]=true; p+=3; }
    }
    for(var q=decStart+3; q<cols.length; q+=3) comma[q]=true;
    var out='<div class="ol-digits ol-justify-center">';
    cols.forEach(function(c,i){
      if(i===decStart && i>0) out+='<span class="ol-digit-sep" aria-hidden="true">.</span>';
      else if(comma[i]) out+='<span class="ol-digit-sep" aria-hidden="true">,</span>';
      var d = (c[1]==null || c[1]==='') ? '' : String(c[1]);
      var tone = d==='' ? 'ol-digit--empty' : (d==='0' ? 'ol-digit--zero' : 'ol-digit--given');
      out+='<div class="ol-digit-col"><span class="ol-digit-col__label">'+esc(pvAbbr(c[0]))+'</span>'+
        '<span class="ol-digit '+tone+'">'+esc(d)+'</span></div>';
    });
    out+='</div>';
    if(v.caption) out+='<p class="ol-text-secondary ol-text-center ol-mb-0">'+esc(v.caption)+'</p>';
    return '<div class="ol-bg-muted ol-rounded-xl ol-p-6 ol-lookback-panel">'+out+'</div>';
  }

  function feedback(){
    openSplit();
    setSolo(false);
    var items = SESSION.feedback || [];
    if(!items.length){
      state.screen = SESSION.lessonContent ? 'lesson' : 'run';
      if(state.screen==='run') state.i = RESUME_AT;
      return render();
    }
    stageSplitWrap.classList.add('ol-lookback');
    var seen = state.fbSeen;
    var curIdx = -1;
    for(var i=0;i<items.length;i++){ if(!seen[i]){ curIdx=i; break; } }
    if(curIdx===-1) curIdx = items.length-1;   // defensive: everything already seen
    var it = items[curIdx], total = items.length;

    var card = h('<article class="ol-card"></article>');
    card.appendChild(h(
      '<div class="ol-flex ol-items-center ol-justify-between ol-wrap ol-gap-3">'+
      '<span class="ol-pill">Look back '+(curIdx+1)+' of '+total+'</span>'+
      (it.q ? '<span class="ol-text-secondary ol-weight-700">From '+esc(it.q)+'</span>' : '')+
      '</div>'));
    card.appendChild(h('<h1>'+esc(it.title||'')+'</h1>'));

    // Literal, not generated: the child's own wrong answer and the question
    // it was for, straight from their attempt record.
    if(it.lastTry && it.lastTry.given!=null){
      card.appendChild(h(
        '<div class="ol-flex ol-items-center ol-gap-3 ol-bg-muted ol-rounded-xl ol-p-4">'+
        icon('clock','ol-icon ol-text-secondary')+
        '<span>Last time you wrote <b>'+esc(it.lastTry.given)+'</b>'+
        (it.lastTry.question ? ' for '+esc(it.lastTry.question) : '')+'.</span></div>'));
    }

    var digits = it.visual ? lookbackDigits(it.visual) : '';
    if(digits) card.appendChild(h(digits));
    else if(it.visual){
      var itVis = visualHtml(it.visual);
      if(itVis) card.appendChild(h(itVis));
    }

    if(!it.lastTry && !it.remember){
      // Legacy shape — body carries the "you wrote", the working, and the
      // rule as one blob. Draw whatever number it already states as digit
      // boxes, and lift the rule into the remember card.
      var legacy = parseLegacyBody(it.body || '');
      if(legacy.wrote){
        card.appendChild(h(
          '<div class="ol-flex ol-items-center ol-gap-3 ol-bg-muted ol-rounded-xl ol-p-4">'+
          icon('clock','ol-icon ol-text-secondary')+
          '<span>Last time you '+legacy.verb+' <b>'+esc(legacy.wrote)+'</b>.</span></div>'));
      }
      if(legacy.cells) card.appendChild(h(digitBoxes(legacy.cells, legacy.caption)));
      else if(legacy.caption){
        var legacyBox = h('<div class="ol-bg-muted ol-rounded-xl ol-p-6 fb-body"></div>');
        legacyBox.textContent = legacy.caption;
        card.appendChild(legacyBox);
      }
      if(legacy.rule){
        card.appendChild(h(
          '<div class="ol-rule-card">'+
          icon('star','ol-icon ol-text-amber')+
          '<div><div class="ol-rule-card__label">Remember</div>'+
          '<p class="ol-rule-card__text ol-mb-0">'+esc(legacy.rule)+'</p></div></div>'));
      }
    } else {
      if(it.body){
        var bodyBox = h('<div class="fb-body"></div>');
        bodyBox.innerHTML = it.body;
        card.appendChild(bodyBox);
      }
      if(it.remember){
        card.appendChild(h(
          '<div class="ol-rule-card">'+
          icon('star','ol-icon ol-text-amber')+
          '<div><div class="ol-rule-card__label">Remember</div>'+
          '<p class="ol-rule-card__text ol-mb-0">'+esc(it.remember)+'</p></div></div>'));
      }
    }

    var go = h('<button type="button" class="ol-btn ol-btn--primary">Got it ✓</button>');
    go.addEventListener('click', function(){
      state.fbSeen[curIdx] = true;
      if(curIdx+1>=items.length){
        // Welcome already happened. The last card opens the work.
        leadIn = 'feedback.done';
        if(SESSION.lessonContent) state.screen = 'lesson';
        else { state.i=RESUME_AT; state.screen='run'; }
      }
      render();
    });
    var actions = h('<div class="ol-flex ol-justify-end ol-wrap ol-gap-3"></div>');
    actions.appendChild(go);
    card.appendChild(actions);
    stageHead.appendChild(card);

    // Ollie speaks from her dock: the first item gets her look-back line, each next one
    // its own. The list below is the map of the same items, one title each.
    if(isNewScreen('feedback|'+curIdx)) say(curIdx===0 ? 'feedback' : 'feedback.item');

    var listInner = '<div class="ol-rule-card__label ol-lookback-kicker">From last time</div>' + items.map(function(fi,i){
      var isDone = !!seen[i], isCur = i===curIdx;
      var stone = isDone ? 'ol-stone ol-stone--done' : isCur ? 'ol-stone ol-stone--current' : 'ol-stone';
      var numContent = isDone ? icon('check','ol-icon') : String(i+1);
      return '<div class="ol-flex ol-items-center ol-gap-3 ol-p-4'+(isCur?' ol-lookback-current ol-rounded-xl':'')+'">'+
        '<span class="'+stone+'">'+numContent+'</span>'+
        '<span class="ol-grow ol-min-w-0 '+(isCur?'ol-weight-800':'ol-text-tertiary ol-weight-700')+'">'+esc(fi.title||'')+'</span></div>';
    }).join('');
    stageSide.appendChild(h('<div class="ol-rounded-xl ol-p-6 ol-lookback-list">'+listInner+'</div>'));
  }

  function lesson(){
    var card = singleCard();
    card.appendChild(h(badge('New idea')));
    // Legacy lessonContent sessions predate teach.cycles[]; Ollie is always the
    // 'teaching' register here, whatever computeRegister() says.
    if(isNewScreen('lesson')){ speaker.setRegister && speaker.setRegister('teaching'); say('open'); }
    var box=h('<div class="bg-app-grayBox rounded-xl p-4 leading-relaxed lesson-body"></div>');
    box.innerHTML = SESSION.lessonContent || '';
    card.appendChild(box);
    var b=h('<button type="button" class="'+BTN_PRIMARY+' w-full">Got it — let me try</button>');
    b.addEventListener('click', function(){ state.screen='run'; state.i=RESUME_AT; render(); });
    card.appendChild(b);
  }

  function start(){
    openSplit();
    stageSplitWrap.classList.add('ol-start');
    var S = SESSION;
    setTopicHeader(S.topicName);
    setCounter('');
    var dateEl = document.getElementById('start-date');
    if(dateEl){
      var d = new Date();
      var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      dateEl.textContent = days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];
    }

    var card = h('<article class="ol-card"></article>');
    var kicker = 'Today\'s session'+(S.sessionMinutes ? ' · about '+S.sessionMinutes+' minutes' : '');
    card.appendChild(h('<span class="ol-pill">'+esc(kicker)+'</span>'));
    // The authored greeting is the welcome. The blurb stays under it.
    // Ollie says her own open line beside the card, so the greeting is not
    // said twice.
    card.appendChild(h('<h1>'+esc(S.greeting||'')+'</h1>'));
    if(S.blurb) card.appendChild(h('<p class="ol-text-secondary">'+esc(S.blurb)+'</p>'));

    var group = S.topicGroup ? String(S.topicGroup).split(',')[0].trim() : '';
    card.appendChild(h(
      '<div class="ol-start-topic">'+
        '<span class="ol-start-topic-icon">'+icon('lessonColumns','ol-icon')+'</span>'+
        '<div class="ol-min-w-0">'+
          (group ? '<div class="ol-header__eyebrow">'+esc(group)+'</div>' : '')+
          '<div class="ol-start-topic-name">'+esc(S.topicName||'')+'</div>'+
          (S.topicDescription ? '<p class="ol-text-secondary ol-mb-0">'+esc(S.topicDescription)+'</p>' : '')+
        '</div></div>'));

    var plan = [];
    var fbN = (S.feedback||[]).length;
    var wuN = (S.warmup && S.warmup.items || []).length;
    var prN = (S.practice||[]).length;
    if(fbN) plan.push({ icon:'clock', tone:'amber', title:'Look back', note: fbN+' '+(fbN===1?'thing':'things')+' from last time' });
    if(S.teach){
      plan.push({ icon:'clueBulb', tone:'blue', title:'Learn', note: S.teach.title || 'A new idea' });
    }
    var practiceN = prN + (S.teach ? 0 : wuN);
    if(practiceN) plan.push({ icon:'lessonBook', tone:'sage', title:'Practice', note: practiceN+' '+(practiceN===1?'question':'questions') });
    if(plan.length){
      card.appendChild(h('<div class="ol-header__eyebrow">The plan</div>'));
      var row = h('<div class="ol-start-plan"></div>');
      plan.forEach(function(p, i){
        row.appendChild(h(
          '<div class="ol-start-step">'+
            '<span class="ol-start-step-icon" data-tone="'+p.tone+'">'+icon(p.icon,'ol-icon')+'</span>'+
            '<div class="ol-header__eyebrow">Step '+(i+1)+'</div>'+
            '<div class="ol-start-step-title">'+esc(p.title)+'</div>'+
            '<p class="ol-text-secondary ol-mb-0">'+esc(p.note)+'</p>'+
          '</div>'));
      });
      card.appendChild(row);
    }

    var actions = h('<div class="ol-flex ol-justify-end"></div>');
    var b = h('<button type="button" class="ol-btn ol-btn--primary">Let\'s go '+icon('arrowRight','ol-icon')+'</button>');
    b.addEventListener('click', function(){
      // Browsers only allow sound after a tap, and this is the child's first. Ollie greets
      // them, then the next screen's own line follows.
      if(dock) dock.unlock();
      leadIn = 'start';
      var pending = (SESSION.feedback||[]).some(function(_, i){ return !state.fbSeen[i]; });
      if(pending) state.screen = 'feedback';
      else if(SESSION.lessonContent) state.screen = 'lesson';
      else { state.screen='run'; state.i=RESUME_AT; }
      render();
    });
    actions.appendChild(b);
    card.appendChild(actions);
    stageHead.appendChild(card);

    var weekCard = weekCardHtml(S);
    if(weekCard) stageSide.appendChild(h(weekCard));
  }

  // "This week" under Ollie. Days and the streak count come from finished
  // sessions (SESSION.week / SESSION.streak). A day with no session stays
  // empty — the card never borrows the design's sample streak.
  function weekCardHtml(S){
    if(!S || S.demo || !Array.isArray(S.week) || !S.week.length) return '';
    var today = null;
    S.week.forEach(function(d){ if(d.today) today = d; });
    var line = '';
    if(today && today.state!=='done'){
      line = S.streak>0
        ? ('Finish today\'s session to make it a '+(S.streak+1)+'-day streak!')
        : 'Finish today\'s session to start a streak.';
    } else if(S.streak>0){
      line = 'Today\'s already done — that\'s a '+S.streak+'-day streak.';
    }
    var dots = S.week.map(function(d){
      var mark = d.state==='done' ? icon('streakFlame','ol-icon') : '';
      return '<li><span class="ol-week-dot" data-state="'+esc(d.state)+'" aria-hidden="true">'+mark+'</span>'+
        '<span class="ol-week-label">'+esc(d.label)+'</span></li>';
    }).join('');
    return '<aside class="ol-week">'+
      '<div class="ol-week-head">'+
        '<span class="ol-header__eyebrow">This week</span>'+
        (S.streak>0 ? '<span class="ol-week-streak">'+S.streak+'-day streak</span>' : '')+
      '</div>'+
      '<ol class="ol-week-days">'+dots+'</ol>'+
      (line ? '<p>'+esc(line)+'</p>' : '')+
    '</aside>';
  }

  // Header chips for a teach walkthrough: one per cycle, named from
  // stepLabel when the lesson authored one. A single unnamed part has
  // nothing to put in a chip, so the caller keeps the question stones.
  function learnCycleChipsHtml(){
    var block = steps[state.i];
    if(!block || block.kind!=='teach') return '';
    var cycles = [];
    steps.forEach(function(st){ if(st.kind==='teach') cycles.push(st); });
    var named = cycles.some(function(st){ return st.cycle && st.cycle.stepLabel; });
    if(cycles.length<2 && !named) return '';
    return '<ol class="ol-steps">'+cycles.map(function(st){
      var i = st.cycleIndex;
      var label = (st.cycle && st.cycle.stepLabel) || ('Part '+(i+1));
      var cur = i===block.cycleIndex;
      var done = i<block.cycleIndex;
      var attrs = cur ? ' aria-current="step"' : (done ? ' data-state="done"' : '');
      var num = done ? icon('check','ol-icon') : String(i+1);
      return '<li class="ol-steps__item"'+attrs+'><span class="ol-steps__dot">'+num+'</span>'+esc(label)+'</li>';
    }).join('')+'</ol>';
  }

  function teach(){
    openSplit();
    stageSplitWrap.classList.add('ol-learn');
    var block=steps[state.i], cyc=block.cycle;
    var sub=state.teachStep[state.i] || 0;
    var st=cyc.steps[sub];
    var last=(sub===cyc.steps.length-1);
    var many=block.cycleCount>1;
    var manySteps=cyc.steps.length>1;

    setTopicHeader(block.title);
    var card = h('<article class="ol-card"></article>');
    // Part is the cycle. When this part has several beats, they are the
    // numbered list under the title, so the pill stays on the part.
    var partLabel = many ? ('Part '+(block.cycleIndex+1)+' of '+block.cycleCount) : 'New idea';
    if(cyc.stepLabel) partLabel += ' · '+cyc.stepLabel;
    card.appendChild(h('<span class="ol-pill">'+esc(partLabel)+'</span>'));

    if(manySteps){
      card.appendChild(h('<h1>'+esc(block.title||'')+'</h1>'));
      if(cyc.conceptName) card.appendChild(h('<p class="ol-text-secondary">'+esc(cyc.conceptName)+'</p>'));
    } else {
      card.appendChild(h('<h1>'+esc(st.big||block.title||'')+'</h1>'));
      if(st.note) card.appendChild(h('<p class="ol-text-secondary">'+esc(st.note)+'</p>'));
      else if(cyc.conceptName) card.appendChild(h('<p class="ol-text-secondary">'+esc(cyc.conceptName)+'</p>'));
    }

    var stepVis = st.visual ? visualHtml(st.visual) : st.pv ? pvHtml(st.pv, st.lit||[]) : '';
    if(stepVis) card.appendChild(h('<div class="ol-learn-visual">'+stepVis+'</div>'));

    if(manySteps){
      var wrap=h('<div class="ol-learn-steps"></div>');
      cyc.steps.forEach(function(x,i){
        var on = i===sub, past = i<sub;
        var mark = past ? icon('check','ol-icon') : String(i+1);
        wrap.appendChild(h(
          '<div class="ol-learn-step" data-state="'+(on?'current':past?'done':'later')+'">'+
          '<span class="ol-learn-step-num">'+mark+'</span>'+
          '<div><b>'+esc(x.big)+'</b>'+
            (i<=sub && x.note ? '<p>'+esc(x.note)+'</p>' : '')+
          '</div></div>'));
      });
      card.appendChild(wrap);
    }

    // upNext previews the guided question on the last beat only. Earlier
    // Next clicks stay inside this part.
    var foot=h('<div class="ol-learn-foot"></div>');
    if(last && cyc.upNext){
      foot.appendChild(h('<p class="ol-learn-upnext">'+icon('clock','ol-icon')+'<span>Up next: '+esc(cyc.upNext)+'</span></p>'));
    }
    var b=h('<button type="button" class="ol-btn ol-btn--primary">'+(last?'Let me try one':'Next')+' '+icon('arrowRight','ol-icon')+'</button>');
    b.addEventListener('click', function(){
      if(last){ state.i++; state.tries=0; state.hintsShown=0; state.result=null; leadIn='teach.tryIt'; }
      else state.teachStep[state.i]=sub+1;
      render();
    });
    foot.appendChild(b);
    card.appendChild(foot);
    stageHead.appendChild(card);

    // Ollie narrates every teach step. `st.ollie` is the authored line; a step with none
    // falls back to a position-keyed bank line. She does not paraphrase the maths. The
    // golden rule card is on every step of the part, but it is the takeaway, so it is
    // SPOKEN once, on the last step, after the narration.
    var returning = (state.i===state.resumeStep && sub===0);
    var stepMoment = returning ? 'returning' : sub===0 ? 'teach.step.first' : last ? 'teach.step.last' : 'teach.step.mid';
    if(returning) state.resumeStep = -1;
    var rule = cyc.goldenRule && (cyc.goldenRule.title || cyc.goldenRule.body) ? cyc.goldenRule : null;
    if(isNewScreen('teach|'+state.i+'|'+sub)){
      var lines = [st.ollie ? {text:st.ollie, o:{mood:'point'}} : {moment:stepMoment}];
      if(rule && last) [rule.title, rule.body].forEach(function(t){ if(t) lines.push({text:t, o:{mood:'point'}}); });
      speakAll(lines);
    }
    if(rule){
      stageSide.appendChild(h(
        '<aside class="ol-rule">'+
        '<div class="ol-rule-kicker">'+icon('star','ol-icon')+'<span>Ollie\'s golden rule</span></div>'+
        (rule.title ? '<b>'+esc(rule.title)+'</b>' : '')+
        (rule.body ? '<p>'+esc(rule.body)+'</p>' : '')+
        '</aside>'));
    }
    setSolo(false);
  }

  function question(s){
    openSplit();
    setSolo(false);
    stageSplitWrap.classList.add('ol-practice');
    var q=s.q, qi=qIndex(state.i);
    var qid = q.id || ('q_'+qi);
    var slips={};
    if(q.slips){
      Object.keys(q.slips).forEach(function(k){
        var v=q.slips[k];
        slips[normalise(k)] = (v && typeof v==='object')
          ? { code: v.code || null, say: v.say || '' }
          : { code: null, say: String(v) };
      });
    }
    var oneShot = oneShotSession();
    var allowReveal = !(SESSION.uiMode && SESSION.uiMode.allowReveal === false);

    if(state.result==='right') stageSplitWrap.classList.add('is-correct');
    // "Practice 4 of 8" on the left of the card. The star or the try counter
    // sits on the right. Warm-up questions stay unbadged.
    var headTools = '';
    if(state.result==='right' && state.tries===1){
      headTools += '<span class="ol-star-chip">'+icon('star','ol-icon')+'+1 star · first try</span>';
    }
    if(state.tries>0 && !oneShot && (state.result==='wrong' || state.result===null)){
      var tryCap = allowReveal ? 3 : 4;
      var tryDots = '';
      for(var ti=0; ti<tryCap; ti++) tryDots += '<span class="ol-tries__dot"'+(ti<state.tries?' data-state="used"':'')+'></span>';
      headTools += '<span class="ol-tries">Try '+state.tries+' of '+tryCap+' '+tryDots+'</span>';
    }
    if(s.phase!=='warm' || headTools){
      var badgeLabel = s.phaseTotal ? (s.label+' of '+s.phaseTotal) : s.label;
      var pill = s.phase==='warm' ? '' : '<span class="ol-pill">'+esc(badgeLabel)+'</span>';
      stageHead.appendChild(h('<div class="ol-qhead">'+pill+'<div class="ol-qhead-tools">'+headTools+'</div></div>'));
    }
    // The "a couple you already know" intro used to be an unattributed
    // subtitle here. It's Ollie's line now — she says it in her own card,
    // not the page narrating over her shoulder (docs/mascot.md §2).
    var bare = !/[a-z]/i.test(q.ask) && q.ask.indexOf('?')===-1;
    stageHead.appendChild(h('<h1 class="enter q-title">'+esc(q.ask)+(bare?' = ?':'')+'</h1>'));
    // E1 — recallText/showRecallFrom: an authored spaced-repetition banner
    // that CLAUDE.md documents but the page never rendered. Shown from
    // the question index the author set onward, for the rest of the
    // session, independent of right/wrong state.
    if(SESSION.recallText && qi>=(typeof SESSION.showRecallFrom==='number'?SESSION.showRecallFrom:999)){
      stageHead.appendChild(h(
        '<div class="enter text-[12.5px] font-semibold text-app-sage bg-app-sageLight/50 border border-app-sage/30 rounded-xl px-3 py-2">'+
        esc(SESSION.recallText)+'</div>'));
    }
    var qVis = q.visual ? visualHtml(q.visual) : '';
    if(qVis) stageHead.appendChild(h(qVis));
    // "Show place value chart" lives in the right column, under Ollie and
    // the hints card — see the end of this function, where it's appended
    // last so it sits below whatever else stageSide already holds.

    function appendBackLink(container){
      if(!(qi>0 && !oneShot)) return;
      // Practice and lesson (teaching) stay on the question in front of the
      // child. That look-back link was what sat in the empty middle of a
      // wide screen. Check and retest still allow it.
      var kind = SESSION.kind;
      if(kind === 'practice' || kind === 'lesson') return;
      if(kind !== 'check' && kind !== 'retest' && (s.phase === 'practice' || s.phase === 'teach')) return;
      var backIdx = prevQStep(state.i);
      if(backIdx<0) return;
      var backBtn=h('<button type="button" class="'+BTN_QUIET+'">← Earlier questions</button>');
      backBtn.addEventListener('click', function(){ state.reviewing=true; state.reviewStep=backIdx; render(); });
      container.appendChild(h('<div class="review-back"></div>')).appendChild(backBtn);
    }

    // Resolved questions: Ollie stands beside the card, and the only control
    // left is Next. Scoring is unchanged — a reveal still ends the question.
    function nextButton(){
      var b=h('<button type="button" class="ol-btn ol-btn--primary">Next question '+icon('arrowRight','ol-icon')+'</button>');
      b.addEventListener('click', next);
      var foot=h('<div class="ol-qfoot"></div>');
      foot.appendChild(b);
      stageAction.appendChild(foot);
      appendBackLink(stageAction);
    }
    // The clue track for this question (public/ollie-kit OllieClues). It lives across
    // re-draws of the same question — the child's clues are state — and is rebuilt for the
    // next one. Ollie speaks through it, so she only reacts to what the child does.
    var hints = q.hints || [];
    var track = trackFor(q, qid, hints);
    track.onShowMe = function(){ revealAnswer(); };
    function cluesShown(){ return track.hasClues ? track.clues.state().shown : state.hintsShown; }
    // What the grader and the next look-back read: how much help this question took.
    function helpFields(){
      var st = track.hasClues ? track.clues.state() : { shown:state.hintsShown, usedHelp:state.hintsShown>0, showingMe:false };
      return { hintsUsed: st.shown, usedHelp: !!st.usedHelp, cluesUsed: st.shown, showedMe: !!st.showingMe };
    }

    if(state.result==='moveon'){
      if(state.lastGiven) stageHead.appendChild(h('<p class="ol-text-secondary">You put '+esc(state.lastGiven)+'.</p>'));
      nextButton();
      return;
    }
    if(state.result==='shown'){
      var steer=hints.slice(-1)[0]||'';
      stageHead.appendChild(h(
        '<div class="ol-yousaid"><div><div class="ol-header__eyebrow">The answer</div>'+
        '<p class="ol-yousaid-line">'+esc(q.answer)+'</p>'+
        (steer ? '<p class="ol-text-secondary">'+esc(steer)+'</p>' : '')+'</div></div>'));
      // Worked visual stays scoring-neutral: the question still ends here,
      // exactly as a reveal always has. The child is not asked to retype it.
      if(q.workedVisual){
        var wvHtml = visualHtml(q.workedVisual);
        if(wvHtml) stageHead.appendChild(h('<div class="ol-worked">'+wvHtml+'</div>'));
      }
      nextButton();
      return;
    }
    if(state.result==='exhausted'){
      if(state.lastGiven) stageHead.appendChild(h('<p class="ol-text-secondary">You put '+esc(state.lastGiven)+'.</p>'));
      nextButton();
      return;
    }
    if(state.result==='right'){
      stageHead.appendChild(h(
        '<div class="ol-yousaid">'+
          '<span class="ol-yousaid-mark">'+icon('check','ol-icon')+'</span>'+
          '<div><div class="ol-header__eyebrow">You said</div>'+
          (state.correctedFrom
            ? '<p class="ol-yousaid-line">'+esc(state.correctedFrom)+'. That\'s right \u2014 it\'s spelled '+esc(q.answer)+'.</p>'
            : '<p class="ol-yousaid-line">'+esc(q.answer)+'. That\'s right!</p>')+
          '</div></div>'));
      // An authored visual reinforcing WHY the answer is right. Enrichment
      // only — it never changes the mark.
      if(q.correctVisual){
        var cvHtml = visualHtml(q.correctVisual);
        if(cvHtml) stageHead.appendChild(h('<div class="ol-worked">'+cvHtml+'</div>'));
      }
      // Today so far: answered / first-try stars / still to go, from state.log.
      var answeredSoFar = state.log.filter(function(r){ return r!==null; }).length;
      var starsSoFar = state.log.filter(function(r){ return r==='first'; }).length;
      var toGo = totalQuestions() - answeredSoFar;
      stageSide.appendChild(h(
        '<aside class="ol-today">'+
          '<div class="ol-header__eyebrow">Today so far</div>'+
          '<div class="ol-today-grid">'+
            '<div><b>'+answeredSoFar+'</b><span>questions</span></div>'+
            '<div><b class="ol-today-stars">'+starsSoFar+'</b><span>first-try stars</span></div>'+
            '<div><b>'+Math.max(0,toGo)+'</b><span>to go</span></div>'+
          '</div></aside>'));
      nextButton();
      return;
    }

    // Amber once a wrong answer is back, pre-filled so they can correct it. The clues sit
    // under the answer box, in the same card, so the child can re-read them while typing.
    var isWrong = state.result==='wrong';
    var given = state.lastGiven||'';
    var slip = isWrong ? (slips[normalise(given)] || slips[given] || null) : null;
    stageAction.appendChild(h('<div class="ol-answer-label">Your answer</div>'));
    // A word answer ("equilateral", "isosceles") needs letters. inputmode="decimal"
    // hands an iPad a number pad with no letters on it at all, so the child cannot
    // type the answer; the placeholder then asks for the wrong thing on top of that.
    var wordAnswer = /[a-z]/i.test(String(q.answer == null ? '' : q.answer));
    var inp=h('<input type="text" inputmode="'+(wordAnswer?'text':'decimal')+'" autocomplete="off" id="ans" aria-label="Your answer" '+
      'placeholder="'+(wordAnswer?'Type your answer':'Type your number')+'" '+
      'class="ol-answer"'+(isWrong?' data-state="retry"':'')+'>');
    if(isWrong) inp.value = state.lastGiven || '';
    var go =h('<button type="button" class="ol-btn ol-btn--primary">'+
      (isWrong ? ('Try again '+icon('replay','ol-icon')) : ('Check '+icon('check','ol-icon')))+'</button>');
    var ansRow=h('<div class="ol-answer-row"></div>');
    ansRow.appendChild(inp); ansRow.appendChild(go);
    stageAction.appendChild(ansRow);
    // The explanation of a predicted slip is shown, not spoken: a second spoken line would
    // cut off Ollie's reaction to the wrong try.
    if(slip && slip.say){
      stageAction.appendChild(h('<div class="ol-slip">'+icon('clueBulb','ol-icon')+'<span>'+esc(slip.say)+'</span></div>'));
    }
    if(track.hasClues) stageAction.appendChild(track.host);

    if(isWrong && s.guided && s.cycle && s.cycle.secondAngle){
      state.angleSeen[qid]=true;
      var saInner = '<div class="ol-header__eyebrow">Another way to see it</div>';
      (s.cycle.secondAngle.steps||[]).forEach(function(x){
        var v = x.visual ? visualHtml(x.visual) : (x.pv ? pvHtml(x.pv, x.lit||[]) : '');
        saInner += '<p class="ol-angle-step"><b>'+esc(x.big)+'</b>'+
          (x.note?'<span>'+esc(x.note)+'</span>':'')+'</p>';
        if(v) saInner += v;
      });
      stageSide.appendChild(h('<div class="ol-angle">'+saInner+'</div>'));
    }

    // Opener: a NEW question speaks (or stays silent) — a redraw after an answer does not.
    // Ollie reacts to answers; she does not narrate every question.
    if(!isWrong && state.tries===0 && isNewScreen('q|'+state.i)){
      var total = totalQuestions();
      var opener = null;
      if(state.i===state.resumeStep){ opener='returning'; state.resumeStep=-1; }
      else if(s.phase==='warm' && state.i===0) opener='warmup';
      else if(s.phase==='practice' && firstPracticeStepIdx>0 && state.i===firstPracticeStepIdx) opener='transition';
      else if(!oneShot && total>=6 && !state.halfwayShown && qi===Math.floor(total/2)){ opener='halfway'; state.halfwayShown=true; }
      var items = [];
      if(opener) items.push({moment:opener});
      // First question of a block: practice and teaching say how the clues work; an
      // assessment just says "take your time".
      var firstOfBlock = s.phase==='practice' && state.i===firstPracticeStepIdx;
      if(firstOfBlock) items.push({moment: REGISTER==='assessment' ? 'fresh' : 'hintNote'});
      else if(qi===total-1 && total>=3 && !opener) items.push({moment:'lastQuestion'});
      else if(!items.length && q.ollie && q.ollie.fresh) items.push({moment:'fresh'});
      if(items.length) speakAll(items);
    }

    var chartHost = h('<div class="ol-chart-host"></div>');
    stageSide.appendChild(chartHost);
    if(q.visual && q.visual.type==='placeValue' &&
       (q.visual.cols||[]).some(function(c){ return c[1]; })){
      appendChartToggle(chartHost, q.visual, 'q:'+qid);
    }
    if(!chartHost.childNodes.length) chartHost.remove();

    function revealAnswer(){
      var hf = helpFields();
      postAttempt({
        questionId: qid, secondAngleShown: !!state.angleSeen[qid],
        given: state.lastGiven, correct: false,
        tries: state.tries, hintsUsed: hf.hintsUsed, usedHelp: hf.usedHelp, cluesUsed: hf.cluesUsed, showedMe: true,
        slipCode: null, revealed: true, msTaken: 0
      });
      state.result='shown';
      state.log[qi]='shown';
      render();
    }
    function moveOnButton(){
      var eb=h('<button type="button" class="ol-btn ol-btn--secondary">Move on</button>');
      eb.addEventListener('click', function(){
        postAttempt({
          questionId: qid, secondAngleShown: !!state.angleSeen[qid],
          given: state.lastGiven, correct: false,
          tries: state.tries, hintsUsed: cluesShown(),
          slipCode: null, exhausted: true, msTaken: 0
        });
        state.result='exhausted';
        state.log[qi]='exhausted';
        render();
        speaker.say('exhausted');
      });
      return eb;
    }
    // A question with no clues has nothing to run out of, so its "Show me how" stays a
    // button the child chooses, from the third try — as it always was.
    if(!track.hasClues && state.tries>=2 && allowReveal && !oneShot){
      var sb=h('<button type="button" class="ol-btn ol-btn--secondary">Show me how</button>');
      sb.addEventListener('click', function(){ speaker.say('showme.start'); revealAnswer(); });
      stageAction.appendChild(sb);
    }
    if(state.tries>=4 && !allowReveal) stageAction.appendChild(moveOnButton());
    appendBackLink(stageAction);

    var qStart=Date.now();
    function submit(){
      var v=inp.value;
      if(normalise(v)===null){ inp.focus(); return; }
      var ms=Date.now()-qStart;
      state.tries++;
      var slipKeys = Object.keys(slips);
      var isCorrect=correct(v, q.answer, slipKeys);
      // Right answer, wrong spelling. Kept on the attempt rather than quietly
      // smoothed away: a child who cannot spell the word is not the same as one
      // who can, and nothing else would record the difference.
      var spellingFixed = isCorrect && normalise(v) !== normalise(q.answer);
      state.correctedFrom = spellingFixed ? v : null;
      var matched=slips[normalise(v)] || null;
      var hf = helpFields();
      postAttempt({
        questionId: qid, secondAngleShown: !!state.angleSeen[qid],
        given: v,
        correct: isCorrect,
        spellingFixed: spellingFixed || undefined,
        tries: state.tries,
        hintsUsed: hf.hintsUsed, usedHelp: hf.usedHelp, cluesUsed: hf.cluesUsed, showedMe: hf.showedMe,
        slipCode: matched ? matched.code : null,
        msTaken: ms
      });
      // Streak tracking for Ollie's 'streak'/'comeback' moments — any
      // non-first-try result breaks a first-try streak (docs/mascot.md §4).
      var tryNo = state.tries;
      if(isCorrect && tryNo===1) state.streak++;
      else state.streak=0;

      if(oneShot){
        state.lastGiven=v;
        state.result='moveon';
        if(state.log[qi]===null) state.log[qi] = isCorrect ? (tryNo===1?'first':'retry') : 'wrong';
        render();
        speaker.say('moveon');
      } else if(isCorrect){
        state.result='right';
        if(state.log[qi]===null) state.log[qi] = tryNo===1 ? 'first' : 'retry';
        render();
        // right.first becomes streak after three or five first-tries in a row, and a
        // second-try answer is a comeback; the clue track picks right.first / recovered.
        speaker.remap = function(m){
          if(m==='right.first' && (state.streak===3 || state.streak===5) && state.streakShown<2){ state.streakShown++; return 'streak'; }
          if(m==='right.recovered' && tryNo===2) return 'comeback';
          return m;
        };
        if(track.hasClues || REGISTER==='assessment') track.clues.correct();
        else speaker.say(tryNo===1 ? 'right.first' : tryNo===2 ? 'comeback' : 'right.recovered');
        speaker.remap = null;
      } else {
        state.lastGiven=v;
        state.result='wrong';
        if(state.log[qi]===null) state.log[qi]='retry';
        render();
        if(track.hasClues || REGISTER==='assessment') track.clues.wrongTry();
        else speaker.say(state.tries>=3 ? 'wrong.stuck' : state.tries===2 ? 'wrong.again' : 'wrong.first');
      }
      setTimeout(focusAns,0);
    }
    go.addEventListener('click', submit);
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
    setTimeout(focusAns,0);
  }

  // The clue track for a question, kept while the same question is on screen. A question
  // with no authored clues has no track to run (OllieClues would offer "Show me how" on
  // the second wrong try), so the page falls back to speaking the moments itself.
  var clueTrack = null;   // restored from the attempt record after a reload (see trackFor)
  function trackFor(q, qid, hints){
    if(clueTrack && clueTrack.qid===qid) return clueTrack;
    if(clueTrack) clueTrack.clues.destroy();
    var host = document.createElement('div');
    host.className = 'ollie-clues';
    var t = { qid:qid, host:host, hasClues: hints.length>0 && REGISTER!=='assessment', onShowMe:null, clues:null };
    speaker.setQuestion(q);
    t.clues = OllieClues.create({
      container: host, clues: hints, dock: speaker, register: REGISTER,
      onShowMe: function(){ if(t.onShowMe) t.onShowMe(); }
    });
    // A reload mid-question: the attempts say how many tries and clues the child had. Replay
    // them into the new track without a sound, so the clues are where they left them.
    if(t.hasClues && state.tries>0 && speaker.quietly){
      speaker.quietly(function(){
        for(var k=0; k<Math.min(state.tries, hints.length+1); k++) t.clues.wrongTry();
        while(t.clues.state().shown < Math.min(state.hintsShown, hints.length)) t.clues.help();
      });
    }
    // A diagram written for a clue (q.hintVisuals) goes under that clue's text. The kit
    // draws the clue box; this adds the picture whenever the box is redrawn.
    new MutationObserver(function(){
      var box = host.querySelector('.ollie-clue');
      if(!box || box.querySelector('.ol-clue-visual')) return;
      var vis = (q.hintVisuals||[])[Number(box.getAttribute('data-clue'))];
      var html = vis ? visualHtml(vis) : '';
      if(html) box.appendChild(h('<div class="ol-clue-visual">'+html+'</div>'));
    }).observe(host, { childList:true });
    clueTrack = t;
    return t;
  }

  function focusAns(){
    var a=document.getElementById('ans');
    if(!a) return;
    a.focus();
    if(a.scrollIntoView) a.scrollIntoView({block:'center', behavior:'smooth'});
  }

  function next(){
    state.i++; state.tries=0; state.hintsShown=0; state.result=null; state.lastGiven='';
    if(state.i>=steps.length){ state.screen='close'; }
    speaker.stop();   // a reaction to the last answer must not talk over the next question
    render();
  }

  function reviewQuestion(){
    var card = singleCard();
    var stepIdx = state.reviewStep;
    var s = steps[stepIdx], q = s.q, qi = qIndex(stepIdx);
    var qid = q.id || ('q_'+qi);
    var atts = (SESSION.attempts||[]).filter(function(a){ return a.questionId===qid; });
    var resolved = atts.some(function(a){ return a.correct; });

    card.appendChild(h(badge(s.label)));
    var bare = !/[a-z]/i.test(q.ask) && q.ask.indexOf('?')===-1;
    card.appendChild(h('<h1 class="text-[24px] font-extrabold tracking-tight">'+esc(q.ask)+(bare?' = ?':'')+'</h1>'));
    var revVis = q.visual ? visualHtml(q.visual) : '';
    if(revVis) card.appendChild(h(revVis));

    var hist = h('<div class="bg-app-grayBox rounded-xl p-3.5 flex flex-col gap-1.5 text-[14px]"></div>');
    if(atts.length){
      atts.forEach(function(a){
        var cls = a.correct ? 'text-app-sage' : (a.revealed || a.exhausted) ? 'text-app-muted' : 'text-app-peachText';
        var label = a.correct ? 'Correct' : a.revealed ? 'Shown the answer' : a.exhausted ? 'Moved on' : 'Not yet';
        hist.appendChild(h('<div><span class="font-bold '+cls+'">'+label+'</span> — put <b>'+esc(a.given)+'</b></div>'));
      });
    } else {
      hist.appendChild(h('<div><span class="text-app-muted font-bold">Not answered yet</span></div>'));
    }
    card.appendChild(hist);

    if(!resolved){
      var inp=h('<input type="text" inputmode="decimal" autocomplete="off" id="ans" aria-label="Your answer" placeholder="?" '+
        'class="q-placeholder h-12 flex-1 min-w-0 rounded-xl bg-app-grayBox text-center font-extrabold text-[20px] border-2 border-app-border focus:outline-none focus:shadow-none focus:border-app-peachBorder">');
      var go=h('<button type="button" class="'+BTN_PRIMARY+'">Check</button>');
      var row=h('<div class="cluster"></div>');
      row.appendChild(inp); row.appendChild(go);
      card.appendChild(row);
      var submit=function(){
        var given=(inp.value||'').trim();
        if(!given) return;
        var ok = correct(given, q.answer, Object.keys(q.slips||{}));
        postAttempt({ questionId: qid, given: given, correct: ok, tries: atts.length+1,
                      hintsUsed:0, slipCode: null, msTaken: 0 });
        render();
      };
      go.addEventListener('click', submit);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });
      setTimeout(focusAns,0);
    }

    var nav=h('<div class="flex items-center gap-4"></div>');
    var p = prevQStep(stepIdx);
    if(p>=0){
      var pb=h('<button type="button" class="'+BTN_QUIET+'">← Earlier</button>');
      pb.addEventListener('click', function(){ state.reviewStep=p; render(); });
      nav.appendChild(pb);
    }
    var n = nextQStep(stepIdx, state.i);
    if(n>=0){
      var nb=h('<button type="button" class="'+BTN_QUIET+'">Later →</button>');
      nb.addEventListener('click', function(){ state.reviewStep=n; render(); });
      nav.appendChild(nb);
    }
    if(nav.children.length) card.appendChild(nav);

    var cont=h('<button type="button" class="'+BTN_PRIMARY+' w-full">Continue where I left off</button>');
    cont.addEventListener('click', function(){ state.reviewing=false; render(); });
    card.appendChild(cont);
  }

  // E6 — a one-line reflection built from state.log, not authored: the
  // "tutor remembers what just happened" feeling, from data the page
  // already has. Never touches verdicts/progression — purely a close-screen
  // sentence, same spirit as the completion pills already shown below it.
  function closeReflection(first, retry, shown, exhausted, total){
    if(total===0) return '';
    if(first===total) return 'Every single one, first try — that\'s brilliant.';
    if(shown+exhausted===0 && first/total>=0.8) return 'Most of those were first-try — a strong session.';
    if(retry>first) return 'You stuck with the tricky ones — that\'s what counts.';
    if(shown+exhausted>0) return 'Some tough ones in there today. Showing up for them matters.';
    return '';
  }

  function close(){
    var card = singleCard();
    var first=state.log.filter(function(r){ return r==='first'; }).length;
    var retry=state.log.filter(function(r){ return r==='retry'; }).length;
    var shown=state.log.filter(function(r){ return r==='shown'; }).length;
    var exhausted=state.log.filter(function(r){ return r==='exhausted'; }).length;
    var total=state.log.length;
    var c = SESSION.close || {};
    card.appendChild(h('<div class="self-center w-24 h-24 rounded-full bg-app-sageLight flex items-center justify-center text-4xl">🎈</div>'));
    card.appendChild(h('<h1 class="text-center text-[26px] font-extrabold tracking-tight">All done for today</h1>'));
    // The authored close.line / close.next and a reflection computed from this session's
    // own log, as one plain block. Ollie says her goodbye, then the authored lines; a
    // perfect session gets a cheer first.
    var reflection = SESSION.kind!=='placement' ? closeReflection(first,retry,shown,exhausted,total) : '';
    var closeBody = [c.line, c.next, reflection].filter(Boolean).join(' ');
    if(closeBody) card.appendChild(h('<p class="text-center text-app-muted text-[15px] font-semibold">'+esc(closeBody)+'</p>'));
    if(isNewScreen('close')){
      var bye = [];
      if(total>0 && first===total && SESSION.kind!=='placement') bye.push({moment:'celebrate'});
      bye.push({moment:'close'});
      [c.line, c.next].forEach(function(t){ if(t) bye.push({text:t}); });
      speakAll(bye);
    }
    if(SESSION.kind !== 'placement'){
      card.appendChild(h('<div class="flex gap-2 flex-wrap justify-center">'+
        '<span class="text-[13px] font-semibold text-app-muted bg-app-grayBox border border-app-border rounded-full px-3 py-1.5">'+first+' straight away</span>'+
        (retry?'<span class="text-[13px] font-semibold text-app-muted bg-app-grayBox border border-app-border rounded-full px-3 py-1.5">'+retry+' on the second go</span>':'')+
        '</div>'));
    }

    // Hidden unless something did not save. The screen above is built in the
    // browser, so without this a failed save looked exactly like a good one.
    var note = h('<div class="bg-app-peachBg border border-app-peachBorder rounded-xl p-4 flex flex-col gap-2" hidden></div>');
    card.appendChild(note);
    function checkSaved(){
      if(!sendQueue.length){ note.hidden = true; return; }
      note.hidden = false;
      note.innerHTML = '<b class="text-app-peachText">Your work has not saved yet</b>'+
        '<div>Please show this to a grown-up, and keep this page open — nothing is lost yet.</div>';
      var again = h('<button type="button" class="'+BTN_PRIMARY+'">Try saving again</button>');
      again.addEventListener('click', function(){ again.disabled = true; flushQueue().then(checkSaved); });
      note.appendChild(again);
    }
    postFinish({ first:first, retry:retry, shown:shown, exhausted:exhausted,
                 total:total, msTaken:Date.now()-state.startedAt }).then(checkSaved);
  }

  function renderNothingQueued(info){
    var card = singleCard();
    var name = info.childName ? info.childName.split(' ')[0] : 'there';
    // E4 — Ollie, not an unattributed emoji+paragraph, on what can be the
    // child's loneliest screen: nothing to do and no one saying why.
    card.appendChild(h('<h1 class="text-center text-[22px] font-extrabold tracking-tight">Nothing new yet, '+esc(name)+'!</h1>'));
    card.appendChild(h('<p class="text-center text-app-muted text-[15px] font-semibold">Today\'s maths hasn\'t been set up yet. Check back a bit later.</p>'));
    say('nothingQueued');
    // There used to be a "Practise again" button here. It linked to ?redo=<id>, which
    // nothing read, so it reloaded this same screen. Re-opening a finished session
    // needs its own design (a graded session must not take new answers).
    if(dotsEl) dotsEl.innerHTML='';
    paintFooter();
  }

  // One Ollie per page, bottom-left (public/ollie-kit). Mounted once the session is known,
  // because her register and the child's first name come from it. The name goes in only
  // when it is real, and never in an assessment (the kit's lines enforce that too).
  function mountOllie(session){
    if(!window.OllieDock || !window.OllieVoice || !window.OllieLines) return;
    var first = (!session.demo && session.childName) ? String(session.childName).trim().split(/\s+/)[0] : '';
    var register = session.nothingQueued ? 'practice' : REGISTER;
    try {
      dock = OllieDock.mount({
        register: register,
        name: register==='assessment' ? '' : first,
        voice: OllieVoice.voiceMode(session.childAge),
        idleAfterMs: 0                       // ollie-voice.js runs the nudge, with a recording
      });
      speaker = OllieVoice.attach(dock, { register: register, name: first, idleAfterMs: 45000 });
      speaker.canIdle = function(){ return state.screen==='run' && !state.reviewing; };
    } catch(e){ if(window.console) console.error('Ollie did not load:', e); }
  }

  /* ── boot ─────────────────────────────────────────────────────────── */
  // Icons load in parallel with the session fetch — both must land before
  // the first render, so icon() never has to return '' on the first paint.
  Promise.all([
    loadIcons(),
    OllieVoice.init(),
    apiFetch('/api/sessions/next').then(function(r){
      // 401 is not an error to show the child — this device just needs its
      // key once (see unlock()). A 503 means the server has no keys set at
      // all, which is a grown-up problem too, so say so rather than blaming
      // the connection.
      if(r.status===401) { var e=new Error('unlock'); e.unlock=true; throw e; }
      if(r.status===503) throw new Error('The server is not set up yet. A grown-up needs to finish configuring it.');
      if(!r.ok) throw new Error('Server returned '+r.status);
      return r.json();
    })
  ])
    .then(function(results){
      var session = results[2];
      OllieVoice.setSession(session.audio, apiFetch);
      if(!session.nothingQueued){ SESSION = session; REGISTER = computeRegister(SESSION); }
      mountOllie(session);
      if(session.nothingQueued){ renderNothingQueued(session); return; }
      if(SESSION.demo){
        document.getElementById('demo-banner').hidden = false;
      }
      buildSteps(SESSION);
      setTopicHeader(SESSION.topicName);
      paintChildChip();
      RESUME_AT = resumeFromAttempts();
      // 0 means "nothing answered yet", not "resume at the first step" — storing it made
      // the "You're back! Your spot is saved." line fire on question 1 of every NEW session.
      state.resumeStep = RESUME_AT > 0 ? RESUME_AT : -1;
      // The welcome is the front door. Look back, the lesson card and the
      // questions come after Let's go. A reload that already has answers
      // skips the door and resumes at the question.
      state.screen = RESUME_AT>0 ? 'run' : 'start';
      if(state.screen==='run') state.i = RESUME_AT;
      render();
      OllieVoice.prefetchBank();
    })
    .catch(function(err){
      if(err && err.unlock){ state.screen='unlock'; render(); return; }
      state.screen='error';
      state.errorMsg = err.message || 'Could not connect to the server.';
      render();
    });

})();
</script>
</body>
</html>
